name: desktop-macos-arm64

on:
  push:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-macos-arm64.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-macos-arm64.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop run build
