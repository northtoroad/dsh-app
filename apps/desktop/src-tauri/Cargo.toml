[package]
name = "dsh-desktop-app"
version = "0.1.0"
description = "DeepSeek Harness desktop shell for Apple Silicon and Intel macOS"
authors = ["DeepSeek Harness"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dsh_desktop_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.11.4", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.3.0"
tauri-plugin-opener = "2.4.0"
tauri-plugin-single-instance = "2.3.3"
ctrlc = { version = "3.4.7", features = ["termination"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4"] }
url = "2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
